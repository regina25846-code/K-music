* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { display: flex; align-items: center; justify-content: flex-start; }
#tab {
  width: 22px; height: 96px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: filter 0.15s;
  -webkit-app-region: no-drag;
  border-radius: 0 9px 9px 0;
  box-shadow: 1px 0 4px rgba(0,0,0,0.25), inset 0 0 0 1px rgba(255,255,255,0.14);
}
#tab:hover { filter: brightness(1.1); }
#tab span {
  font-family: "InterTabSub", system-ui, sans-serif;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.14em;
  writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg);
}
</style>
</head>
<body>
<div id="tab" title="K-Music 열기/숨기기">
  <span id="tabLabel">K-MUSIC</span>
</div>
<script>
const TAB_STYLES = {
  default:   { grad: 'linear-gradient(160deg, #FF5C3D, #2A2A34)', color: '#fff' },
  white:     { grad: 'linear-gradient(160deg, #E8492A, #F7F6F3)', color: '#fff' },
  ambient:   { grad: 'linear-gradient(160deg, #F2D799, #B58F4E, #A23C1B)', color: '#2A1608' },
  midnight:  { grad: 'linear-gradient(160deg, #FFE6A8, #C69A52, #4A340F)', color: '#2A1608' },
  vgraphite: { grad: 'linear-gradient(160deg, #C9CDD4, #8B9099, #D9762E)', color: '#1A1B20' },
  vpaper:    { grad: 'linear-gradient(160deg, #FFFFFF, #D6D2C8, #C1502E)', color: '#23211D' },
};

const tab = document.getElementById('tab');

function applyTheme(theme) {
  const s = TAB_STYLES[theme] || TAB_STYLES.default;
  tab.style.background = s.grad;
  tab.style.color = s.color;
}

applyTheme('default');
window.api.onSetTheme(theme => applyTheme(theme));

// 클릭이면 창 숨기기/보이기, 위아래로 끌면 라벨 위치 이동 (버튼 없이 라벨 자체를 잡고 옮기는 방식)
const DRAG_THRESHOLD = 4;
tab.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const startY = e.screenY;
  let dragging = false;
  let lastDy = 0;

  // pointermove는 화면 주사율보다 훨씬 빠르게 쏟아질 수 있고, IPC 왕복(+실제 창 이동)이
  // 그보다 느리면 매번 새로 보낸 호출들이 쌓여서 갈수록 뒤로 밀리는 지연이 누적됨(rAF로
  // "프레임당 1번"만 묶어도, 이전 호출의 응답을 기다리지 않고 계속 새 호출을 쏘면 여전히
  // 밀림). 그래서 한 번에 딱 하나의 호출만 진행 중이게 하고, 그게 끝나야 그 사이 쌓인
  // 것 중 가장 최신 위치 하나만 다음 호출로 보냄 — 실제 처리 속도에 맞춰 자연스럽게
  // 조절되고, 오래된 중간 위치들은 건너뛰어서 절대 밀리지 않음.
  let sending = false;
  let pendingDy = null;
  const flushMove = () => {
    if (sending || pendingDy == null) return;
    sending = true;
    const dy = pendingDy;
    pendingDy = null;
    window.api.tabDragMove(dy).finally(() => {
      sending = false;
      flushMove();
    });
  };
  const onMove = ev => {
    lastDy = ev.screenY - startY;
    if (!dragging && Math.abs(lastDy) > DRAG_THRESHOLD) {
      dragging = true;
      window.api.tabDragStart();
    }
    if (dragging) {
      pendingDy = lastDy;
      flushMove();
    }
  };
  const cleanup = () => {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  };
  const onUp = () => {
    cleanup();
    if (dragging) {
      window.api.tabDragEnd(lastDy);
    } else {
      window.api.toggleMainWindow();
    }
  };
  const onCancel = () => {
    // 제스처가 도중에 취소되면(오푸스 리뷰 지적, 2026-08-02 — 발생 가능성은 낮지만 대칭성 차원에서
    // 방어) pointerup이 안 와서 리스너가 안 풀리고 탭이 마우스를 계속 따라다닐 수 있음.
    cleanup();
    if (dragging) window.api.tabDragEnd(lastDy);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onCancel);
});
</script>
</body>
</html>
