<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>K-Music</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #EDE3DB;
  --panel:     #F5EBE2;
  --card:      #FAF3EE;
  --active-tr: #F5D8CE;
  --text:      #2B1A12;
  --text2:     #7A5548;
  --text3:     #B09080;
  --border:    #D8C4B8;
  --prog:      #7A5548;
  --nav-bg:    #E6D8CF;
  --tog-blue:  #7EB3E8;
  --tog-green: #7ECBA8;
}

html, body {
  width: 400px; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  user-select: none;
  display: flex; flex-direction: column;
}

/* ── HEADER ── */
.header {
  -webkit-app-region: drag;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px;
  height: 52px;
}
.add-url-btn {
  -webkit-app-region: no-drag;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  background: none; border: none; cursor: pointer; color: var(--text2);
}
.add-url-btn .plus { font-size: 22px; line-height: 1; color: var(--text); }
.add-url-btn .label { font-size: 9px; font-weight: 600; color: var(--text3); letter-spacing: 0.03em; }
.app-title {
  font-size: 20px; color: var(--text); line-height: 1;
  display: flex; align-items: baseline; gap: 5px;
}
.app-title .bold { font-weight: 900; font-family: 'Segoe UI Black', 'Arial Black', sans-serif; letter-spacing: -0.01em; }
.app-title .italic { font-style: italic; font-family: 'Playfair Display', 'Georgia', 'Times New Roman', serif; font-weight: 400; font-size: 18px; }
.win-btns {
  -webkit-app-region: no-drag;
  display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s;
}
.header:hover .win-btns { opacity: 1; }
.win-btn {
  width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
  font-size: 9px; display: flex; align-items: center; justify-content: center;
  background: var(--border); color: var(--text2);
}
.win-btn:hover { background: var(--text2); color: #fff; }

/* ── SEARCH BAR ── */
.search-wrap { padding: 0 14px 10px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 14px;
}
.search-box .icon { font-size: 13px; color: var(--text3); flex-shrink: 0; }
.search-box input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 13px; color: var(--text); font-family: inherit;
}
.search-box input::placeholder { color: var(--text3); }

/* ── VIEWS ── */
.view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.view.active { display: flex; }

/* ── HOME: PLAYER ── */
.player { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 16px 8px; flex-shrink: 0; }
.album-art {
  width: 186px; height: 186px; border-radius: 14px; object-fit: cover;
  background: var(--border); flex-shrink: 0;
}
.album-art.default { display: flex; align-items: center; justify-content: center; font-size: 48px; }
.track-title { font-size: 18px; font-weight: 700; color: var(--text); text-align: center; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track-channel { font-size: 12px; color: var(--text3); text-align: center; }
.progress-wrap { width: 100%; }
.progress-bar {
  width: 100%; height: 4px; background: var(--border); border-radius: 2px; cursor: pointer; position: relative;
}
.progress-fill { height: 100%; background: var(--prog); border-radius: 2px; width: 0%; transition: width 0.4s linear; pointer-events: none; position: relative; }
.progress-fill::after {
  content: ''; position: absolute; right: -5px; top: -4px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--prog);
}
.time-row { display: flex; justify-content: space-between; margin-top: 4px; }
.time-row span { font-size: 10px; color: var(--text3); }
.controls { display: flex; align-items: center; width: 100%; padding: 0 2px; }
.ctrl-center { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: center; }
.ctrl-btn { background: none; border: none; cursor: pointer; color: var(--text); padding: 4px; display: flex; align-items: center; justify-content: center; }
.ctrl-btn:hover { color: var(--prog); }
.ctrl-btn.play { font-size: 22px; }
.ctrl-btn.skip { font-size: 18px; }
.ctrl-side { display: flex; gap: 8px; }
.ctrl-btn.side { font-size: 15px; color: var(--text3); }
.ctrl-btn.side.active { color: var(--prog); }
.vol-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 0 2px; }
.vol-icon { font-size: 13px; color: var(--text3); }
input[type=range].vol {
  flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px; background: var(--border); outline: none; cursor: pointer;
}
input[type=range].vol::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--prog); cursor: pointer;
}

/* ── PLAYLIST TABS ── */
.pl-tabs { display: flex; gap: 0; padding: 6px 14px 0; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; border-bottom: 1px solid var(--border); }
.pl-tabs::-webkit-scrollbar { display: none; }
.pl-tab {
  background: none; border: none; padding: 6px 14px; font-size: 12px; font-weight: 600;
  color: var(--text3); cursor: pointer; white-space: nowrap; flex-shrink: 0;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.pl-tab.active { color: var(--text); border-bottom-color: var(--text); }
.pl-tab:hover:not(.active) { color: var(--text2); }

/* ── TRACK LIST ── */
.track-list { flex: 1; overflow-y: auto; padding: 4px 8px; scrollbar-width: none; }
.track-list::-webkit-scrollbar { display: none; }
.track-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px;
  border-radius: 10px; cursor: pointer;
}
.track-item:hover { background: rgba(122,85,72,0.08); }
.track-item.playing { background: var(--active-tr); }
.t-num { width: 18px; font-size: 11px; color: var(--text3); text-align: center; flex-shrink: 0; }
.t-num.arrow { color: var(--prog); font-size: 12px; }
.t-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; background: var(--border); flex-shrink: 0; }
.t-meta { flex: 1; overflow: hidden; }
.t-title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.t-ch { font-size: 10px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.t-del { background: none; border: none; color: var(--border); font-size: 14px; cursor: pointer; padding: 4px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.track-item:hover .t-del { opacity: 1; }
.t-del:hover { color: #D44; }
.track-empty { text-align: center; padding: 28px 16px; color: var(--text3); font-size: 12px; line-height: 1.9; }

/* ── BOTTOM PLAYLIST ACTIONS ── */
.pl-actions { display: flex; gap: 8px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
.pl-act-btn {
  background: none; border: 1px solid var(--border); border-radius: 8px;
  padding: 5px 14px; font-size: 11px; font-weight: 600; color: var(--text2); cursor: pointer;
}
.pl-act-btn:hover { border-color: var(--text2); }
.pl-act-btn.del-pl { padding: 5px 10px; margin-left: auto; }

/* ── SEARCH VIEW ── */
.search-results { flex: 1; overflow-y: auto; padding: 4px 8px; scrollbar-width: none; }
.search-results::-webkit-scrollbar { display: none; }
.search-empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 12px; line-height: 1.8; }
.s-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 10px; cursor: pointer; }
.s-item:hover { background: rgba(122,85,72,0.08); }
.s-thumb { width: 56px; height: 38px; object-fit: cover; border-radius: 6px; background: var(--border); flex-shrink: 0; }
.s-meta { flex: 1; overflow: hidden; }
.s-title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-ch { font-size: 10px; color: var(--text3); margin-top: 2px; }
.s-add { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 10px; font-weight: 700; color: var(--text2); cursor: pointer; flex-shrink: 0; }
.s-add:hover { border-color: var(--prog); color: var(--prog); }

/* ── PLAYLISTS VIEW ── */
.pl-view { flex: 1; overflow-y: auto; padding: 10px 14px; scrollbar-width: none; }
.pl-view::-webkit-scrollbar { display: none; }
.pl-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
}
.pl-card:hover { border-color: var(--prog); }
.pl-card-name { font-size: 13px; font-weight: 700; }
.pl-card-count { font-size: 11px; color: var(--text3); margin-top: 2px; }
.pl-card-btns { display: flex; gap: 6px; }
.pl-card-btn { background: none; border: none; font-size: 15px; color: var(--text3); cursor: pointer; padding: 2px; }
.pl-card-btn:hover { color: var(--prog); }
.pl-add-card {
  border: 1.5px dashed var(--border); border-radius: 12px; padding: 14px;
  text-align: center; font-size: 12px; font-weight: 600; color: var(--text3); cursor: pointer;
}
.pl-add-card:hover { border-color: var(--prog); color: var(--prog); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  height: 44px; background: var(--nav-bg); border-top: 1px solid var(--border);
  display: flex; flex-shrink: 0;
}
.nav-btn {
  flex: 1; background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--text3); font-size: 9px; font-family: inherit;
}
.nav-icon { font-size: 16px; line-height: 1; }
.nav-btn.active { color: var(--text); }
.nav-btn:hover { color: var(--text2); }

/* ── ADD URL OVERLAY ── */
.url-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(43,26,18,0.5); z-index: 200;
  display: none; align-items: flex-start; justify-content: center; padding-top: 60px;
}
.url-overlay.show { display: flex; }
.url-box {
  background: var(--card); border-radius: 14px; padding: 18px 16px; width: 340px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.url-box h3 { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.url-box input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; margin-bottom: 10px;
  font-family: inherit;
}
.url-box input:focus { border-color: var(--prog); }
.url-box-btns { display: flex; gap: 8px; justify-content: flex-end; }
.url-cancel { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; color: var(--text2); }
.url-ok { background: var(--text); color: #fff; border: none; border-radius: 8px; padding: 6px 16px; font-size: 12px; font-weight: 700; cursor: pointer; }

/* ── SETTINGS OVERLAY ── */
.settings-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(43,26,18,0.45); z-index: 300;
  display: none; align-items: center; justify-content: center;
}
.settings-overlay.show { display: flex; }
.settings-card {
  background: var(--panel); border-radius: 18px; width: 340px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.22); overflow: hidden;
}
.settings-head {
  display: flex; align-items: center; justify-content: center;
  padding: 18px 18px 10px; position: relative;
}
.settings-head h2 { font-size: 18px; font-weight: 800; font-family: 'Playfair Display','Georgia',serif; }
.settings-close {
  position: absolute; right: 14px; top: 14px;
  background: none; border: none; font-size: 17px; color: var(--text2); cursor: pointer;
}
.settings-close:hover { color: var(--text); }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; border-top: 1px solid var(--border);
}
.srow-icon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--bg);
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.srow-text { flex: 1; }
.srow-label { font-size: 13px; font-weight: 600; }
.srow-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.srow-ctrl select {
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; color: var(--text); outline: none; cursor: pointer;
  min-width: 120px; font-family: inherit;
}
/* toggle */
.tog { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.tog input { opacity: 0; width: 0; height: 0; position: absolute; }
.tog-track {
  position: absolute; inset: 0; background: var(--border); border-radius: 13px; cursor: pointer; transition: background 0.2s;
}
.tog input:checked + .tog-track { background: var(--tog-blue); }
.tog.green input:checked + .tog-track { background: var(--tog-green); }
.tog-thumb {
  position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  background: #fff; border-radius: 50%; transition: left 0.2s; pointer-events: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.18);
}
.tog input:checked ~ .tog-thumb { left: 23px; }
.settings-row + .settings-row { }
.settings-save {
  margin: 12px 18px 16px; width: calc(100% - 36px); background: var(--text); color: #fff;
  border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.settings-save:hover { opacity: 0.85; }

/* ── TOAST ── */
.toast {
  position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 7px 16px; border-radius: 20px;
  font-size: 12px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 400; white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ── MODAL ── */
.modal-ov {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(43,26,18,0.45); z-index: 500;
  display: none; align-items: center; justify-content: center;
}
.modal-ov.show { display: flex; }
.modal-card { background: var(--card); border-radius: 14px; padding: 20px; width: 290px; box-shadow: 0 8px 30px rgba(0,0,0,0.18); }
.modal-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.modal-card input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 10px; font-size: 13px; color: var(--text); outline: none; margin-bottom: 12px; font-family: inherit;
}
.modal-card input:focus { border-color: var(--prog); }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
.modal-btns button { padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
.m-cancel { background: var(--bg); border: 1px solid var(--border) !important; color: var(--text2); }
.m-ok { background: var(--text); color: #fff; }

/* ── CONTEXT MENU ── */
.ctx-menu {
  position: fixed; z-index: 700; background: var(--card);
  border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15); overflow: hidden;
  display: none;
}
.ctx-menu.show { display: block; }
.ctx-item {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--text);
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.ctx-item:hover { background: var(--bg); }
.ctx-del:hover { color: #D44; }

/* ── LOADING ── */
.loading-ov {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(237,227,219,0.82); z-index: 600;
  display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
}
.loading-ov.show { display: flex; }
.spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--prog); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-ov span { font-size: 12px; color: var(--text2); }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="add-url-btn" id="btn-add-url">
    <span class="plus">⊕</span>
    <span class="label">Add URL</span>
  </button>
  <div class="app-title">
    <span class="bold">K-MUSIC</span>
    <span class="italic">player</span>
  </div>
  <div class="win-btns">
    <button class="win-btn" id="btn-pin" title="Always On Top">📌</button>
    <button class="win-btn" id="btn-min">—</button>
    <button class="win-btn" id="btn-close">✕</button>
  </div>
</div>

<!-- Search bar (shown on home only) -->
<div class="search-wrap" id="home-search">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="qs-input" placeholder="Search YouTube..."/>
  </div>
</div>

<!-- HOME VIEW -->
<div class="view active" id="view-home">
  <div class="player">
    <img class="album-art" id="album-art" src="" alt="" onerror="this.src=''" style="background:#D8C4B8"/>
    <div class="track-title" id="track-title">재생 중인 곡 없음</div>
    <div class="track-channel" id="track-ch">—</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="prog-bar"><div class="progress-fill" id="prog-fill"></div></div>
      <div class="time-row"><span id="t-cur">0:00</span><span id="t-tot">0:00</span></div>
    </div>
    <div class="controls">
      <div class="ctrl-center">
        <button class="ctrl-btn skip" id="btn-prev" title="이전 곡">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play" id="btn-play">
          <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn skip" id="btn-next" title="다음 곡">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="ctrl-side">
        <button class="ctrl-btn side" id="btn-repeat" title="반복" style="position:relative">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          <span class="repeat-badge" style="display:none;position:absolute;top:-2px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--prog);color:#fff;font-size:8px;font-weight:800;align-items:center;justify-content:center;">1</span>
        </button>
        <button class="ctrl-btn side" id="btn-shuffle" title="셔플">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="vol-row">
      <span class="vol-icon">🔈</span>
      <input type="range" class="vol" id="vol" min="0" max="100" value="80"/>
    </div>
  </div>

  <div class="pl-tabs" id="pl-tabs"></div>
  <div class="track-list" id="track-list"></div>
  <div class="pl-actions">
    <button class="pl-act-btn" id="btn-new-pl">Add Playlist</button>
    <button class="pl-act-btn" id="btn-rename-pl">Rename</button>
  </div>
</div>

<!-- SEARCH VIEW -->
<div class="view" id="view-search">
  <div class="search-results" id="search-results">
    <div class="search-empty">위 검색창에서 유튜브를 검색하세요</div>
  </div>
</div>

<!-- PLAYLISTS VIEW -->
<div class="view" id="view-playlists">
  <div class="pl-view" id="pl-view"></div>
</div>

<!-- Bottom nav -->
<div class="bottom-nav">
  <button class="nav-btn active" data-view="home"><span class="nav-icon">🏠</span>Home</button>
  <button class="nav-btn" data-view="search"><span class="nav-icon">🔍</span>Search</button>
  <button class="nav-btn" data-view="playlists"><span class="nav-icon">🎵</span>Playlists</button>
  <button class="nav-btn" id="nav-settings"><span class="nav-icon">⚙</span>Settings</button>
</div>

<!-- Add URL overlay -->
<div class="url-overlay" id="url-overlay">
  <div class="url-box">
    <h3>YouTube URL 추가</h3>
    <input type="text" id="url-input" placeholder="https://www.youtube.com/watch?v=..."/>
    <div class="url-box-btns">
      <button class="url-cancel" id="url-cancel">취소</button>
      <button class="url-ok" id="url-ok">추가</button>
    </div>
  </div>
</div>

<!-- Settings overlay -->
<div class="settings-overlay" id="settings-ov">
  <div class="settings-card">
    <div class="settings-head">
      <h2>Settings</h2>
      <button class="settings-close" id="settings-close">✕</button>
    </div>
    <div class="settings-row">
      <div class="srow-icon">🎧</div>
      <div class="srow-text"><div class="srow-label">Streaming Quality</div></div>
      <div class="srow-ctrl">
        <select id="cfg-quality">
          <option value="128">128k</option>
          <option value="192" selected>192k</option>
          <option value="320">320k</option>
        </select>
      </div>
    </div>
    <div class="settings-row">
      <div class="srow-icon">▶</div>
      <div class="srow-text"><div class="srow-label">Autoplay</div><div class="srow-sub" id="auto-sub">Off</div></div>
      <label class="tog">
        <input type="checkbox" id="cfg-auto"/>
        <div class="tog-track"></div>
        <div class="tog-thumb"></div>
      </label>
    </div>
    <div class="settings-row">
      <div class="srow-icon">🕐</div>
      <div class="srow-text"><div class="srow-label">Resume Last Track</div><div class="srow-sub">on Startup</div></div>
      <label class="tog green">
        <input type="checkbox" id="cfg-resume"/>
        <div class="tog-track"></div>
        <div class="tog-thumb"></div>
      </label>
    </div>
    <div class="settings-row">
      <div class="srow-icon">🚀</div>
      <div class="srow-text"><div class="srow-label">시작 프로그램 등록</div><div class="srow-sub">Windows 시작 시 자동 실행</div></div>
      <label class="tog green">
        <input type="checkbox" id="cfg-startup"/>
        <div class="tog-track"></div>
        <div class="tog-thumb"></div>
      </label>
    </div>
    <button class="settings-save" id="settings-save">저장</button>
  </div>
</div>

<!-- Modal -->
<div class="modal-ov" id="modal">
  <div class="modal-card">
    <h3 id="modal-title">이름 입력</h3>
    <input type="text" id="modal-input"/>
    <div class="modal-btns">
      <button class="m-cancel" id="modal-cancel">취소</button>
      <button class="m-ok" id="modal-ok">확인</button>
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading-ov" id="loading"><div class="spinner"></div><span id="loading-text">로딩 중...</span></div>

<!-- About overlay -->
<div class="settings-overlay" id="about-ov">
  <div class="settings-card" style="width:300px">
    <div class="settings-head">
      <h2>프로그램 정보</h2>
      <button class="settings-close" id="about-close">✕</button>
    </div>
    <div style="padding:16px 20px 20px;text-align:center">
      <img src="../assets/icon.png" style="width:64px;height:64px;border-radius:14px;margin-bottom:12px"/>
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">K-Music Player</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">버전 1.0.0</div>
      <div style="font-size:11px;color:var(--text3);line-height:1.7">유튜브 음악 스트리밍 플레이어<br>yt-dlp 기반 무료 음악 감상</div>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu">
  <button class="ctx-item ctx-del" id="ctx-del">🗑 삭제</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<audio id="audio" preload="none"></audio>
<script src="app.js"></script>
</body>
</html>
