<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Settings</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5EDE8; --bg2: #EDE0D9; --bg3: #E2D0C7; --card: #FAF4F1;
  --accent: #C4704A; --text: #2C1810; --text2: #6B4838; --text3: #9E7060; --border: #D8C4B8;
}
html, body { width: 360px; height: 420px; background: var(--bg); color: var(--text); font-family: 'Segoe UI','Noto Sans KR',sans-serif; user-select: none; overflow: hidden; }

.titlebar {
  -webkit-app-region: drag; display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); height: 40px;
}
.title { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; }
.close-btn { -webkit-app-region: no-drag; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text2); padding: 2px 6px; }
.close-btn:hover { color: var(--accent); }

.content { padding: 20px 20px; display: flex; flex-direction: column; gap: 20px; }

.section-title { font-size: 10px; font-weight: 800; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }

.row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
.row-label { font-size: 13px; font-weight: 600; }
.row-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

select.row-select {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 12px; color: var(--text); outline: none; cursor: pointer;
}
select.row-select:focus { border-color: var(--accent); }

/* toggle */
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-track {
  position: absolute; inset: 0; background: var(--bg3); border-radius: 11px;
  border: 1px solid var(--border); cursor: pointer; transition: background 0.2s;
}
.toggle input:checked + .toggle-track { background: var(--accent); border-color: var(--accent); }
.toggle-thumb {
  position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
  background: #fff; border-radius: 50%; transition: left 0.2s; pointer-events: none;
}
.toggle input:checked ~ .toggle-thumb { left: 21px; }

.save-btn {
  width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px;
  padding: 10px; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 4px;
}
.save-btn:hover { opacity: 0.88; }
</style>
</head>
<body>
<div class="titlebar">
  <div class="title">Settings</div>
  <button class="close-btn" id="btn-close">✕</button>
</div>

<div class="content">
  <div>
    <div class="section-title">스트리밍</div>
    <div class="row">
      <div>
        <div class="row-label">음질</div>
        <div class="row-sub">128k / 192k / 320k</div>
      </div>
      <select class="row-select" id="cfg-quality">
        <option value="128">128k</option>
        <option value="192" selected>192k</option>
        <option value="320">320k</option>
      </select>
    </div>
  </div>

  <div>
    <div class="section-title">재생</div>
    <div class="row" style="margin-bottom:8px">
      <div class="row-label">자동 재생</div>
      <label class="toggle">
        <input type="checkbox" id="cfg-autoplay"/>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <div class="row">
      <div>
        <div class="row-label">마지막 곡 이어 재생</div>
        <div class="row-sub">앱 시작 시 자동으로 이어 재생</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="cfg-resume"/>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <button class="save-btn" id="btn-save">저장</button>
</div>

<script>
(async () => {
  const cfg = await window.api.getConfig();
  document.getElementById('cfg-quality').value = cfg.quality || '192';
  document.getElementById('cfg-autoplay').checked = !!cfg.autoplay;
  document.getElementById('cfg-resume').checked = !!cfg.resume;

  document.getElementById('btn-save').addEventListener('click', async () => {
    await window.api.saveConfig({
      quality: document.getElementById('cfg-quality').value,
      autoplay: document.getElementById('cfg-autoplay').checked,
      resume: document.getElementById('cfg-resume').checked
    });
    await window.api.closeSettings();
  });

  document.getElementById('btn-close').addEventListener('click', () => window.api.closeSettings());
})();
</script>
</body>
</html>
