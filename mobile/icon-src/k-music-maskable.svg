<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
<!--
  K-Music PWA "maskable" 아이콘.

  안드로이드 런처는 홈화면 아이콘에 자기 마스크(원형/둥근사각형 등 기기마다 다름)를 씌운다.
  규격이 보장하는 "안전영역"은 아이콘 한 변의 80% 지름 원(= 중심에서 반지름 40% = 96u 기준 38.4u)
  뿐이고, 그 바깥은 잘려나갈 수 있다.

  그래서 일반 아이콘(k-music.svg)과 두 가지가 다르다:
   1) 배경이 모서리까지 꽉 찬다(둥근사각형 프레임/투명 여백 없음) — 런처가 자기 모양대로 깎는다.
   2) 파형+K배지를 72%로 줄여서 전부 안전영역 안쪽(반지름 37u)에 넣었다.
      원본은 K배지 바깥선이 중심에서 50.8u까지 나가 있어서 안드로이드에서 배지가 잘렸다.

  안쪽 도형은 k-music.svg의 좌표를 그대로 쓰고 그룹 transform 하나로만 줄인다
  (좌표를 손으로 다시 계산하면 그라디언트 축이 어긋난다).
-->
<defs>
<linearGradient id="mg" x1="10.91" y1="2.18" x2="85.09" y2="96" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#F385A3"/><stop offset="1" stop-color="#8B1D50"/>
</linearGradient>
<radialGradient id="mb" cx="0" cy="0" r="1" gradientTransform="translate(24 17.45) rotate(52) scale(63.27 50.18)" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ms" x1="48" y1="0" x2="48" y2="58.91" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity=".40"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<!-- 배지 그림자: 원본은 반지름 22.5인데 둥근사각형에 잘려서 실제로는 아래쪽 2.9u만 보였다.
     여기선 잘라주는 프레임이 없으므로 안전영역에 맞춰 18.5로 줄이고(보이는 두께는 2.2u로 비슷),
     감쇠 구간을 그만큼 압축해서 원래 보이던 모양을 유지한다. -->
<radialGradient id="kbs" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(71.4 72.8) scale(18.5)">
<stop offset=".62" stop-color="#000" stop-opacity=".26"/><stop offset=".95" stop-color="#000" stop-opacity=".14"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
</radialGradient>
<linearGradient id="kbf" x1="71.4" y1="54.04" x2="71.4" y2="88.76" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#CC2A73"/><stop offset="1" stop-color="#691039"/>
</linearGradient>
<linearGradient id="kbr" x1="59" y1="59" x2="84" y2="84" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity=".97"/><stop offset="1" stop-color="#fff" stop-opacity=".74"/>
</linearGradient>
<linearGradient id="kbg" x1="71.4" y1="56.79" x2="71.4" y2="86.01" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".58" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
</defs>

<!-- 배경: 모서리까지 꽉 채운다(런처가 자기 마스크로 깎는다) -->
<rect x="0" y="0" width="96" height="96" fill="url(#mg)"/>
<rect x="0" y="0" width="96" height="96" fill="url(#mb)"/>
<path d="M0 0h96v41.5c-17.5 8.7-33.5 12.7-48 12.7S20.2 50.2 0 38.7Z" fill="url(#ms)"/>

<!-- 파형 + K배지: 중심(48,48) 기준 0.72배 축소 → 전부 안전영역 안 -->
<g transform="translate(48 48) scale(0.72) translate(-48 -48)">
  <g fill="#fff">
  <rect x="23.99" y="42.94" width="6.40" height="12.19" rx="3.20" fill-opacity=".60"/>
  <rect x="34.39" y="34.88" width="6.40" height="28.12" rx="3.20" fill-opacity=".82"/>
  <rect x="44.80" y="25.88" width="6.40" height="46.12" rx="3.20" fill-opacity=".97"/>
  <rect x="55.21" y="33.00" width="6.40" height="31.50" rx="3.20" fill-opacity=".82"/>
  <rect x="65.61" y="40.88" width="6.40" height="15.84" rx="3.20" fill-opacity=".60"/>
  </g>
  <circle cx="71.4" cy="72.8" r="18.5" fill="url(#kbs)"/>
  <circle cx="71.4" cy="71.4" r="15.985" fill="url(#kbf)" stroke="url(#kbr)" stroke-width="2.75"/>
  <circle cx="71.4" cy="71.4" r="14.61" fill="url(#kbg)"/>
  <circle cx="71.4" cy="71.4" r="17.72" fill="none" stroke="#000" stroke-opacity=".12" stroke-width=".7"/>
  <g fill="none" stroke="#fff" stroke-opacity=".97" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <path d="M67.35 65.15V77.65"/><path d="M75.45 65.15L68.65 71.4L75.45 77.65"/>
  </g>
</g>
</svg>
